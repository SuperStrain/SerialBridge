name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily eligibility check; releases are at least 15 days apart.
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check 15-day window and source changes
        id: check
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_eligibility.py

  test:
    needs: release-check
    if: ${{ github.event_name != 'schedule' || needs.release-check.outputs.eligible == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && needs.release-check.outputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and run unit tests
        run: dotnet test SerialBridge.sln -c Debug --nologo

  package:
    needs: [release-check, test]
    if: ${{ github.event_name != 'pull_request' && needs.test.result == 'success' }}
    runs-on: windows-latest
    # Prevent concurrent main, tag and scheduled release packaging/publishing.
    concurrency:
      group: serialbridge-release-package
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && needs.release-check.outputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve and validate package version
        id: version
        shell: pwsh
        env:
          AUTO_VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $projectPath = 'src/SerialBridge.App/SerialBridge.App.csproj'
          $installerPath = 'installer/SerialBridge.iss'
          [xml]$project = Get-Content $projectPath
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          $installerText = Get-Content $installerPath -Raw
          $match = [regex]::Match($installerText, '(?m)^#define AppVersion "([^"]+)"\r?$')
          if (-not $match.Success) { throw 'Inno Setup AppVersion was not found' }
          $installerVersion = $match.Groups[1].Value
          if ('${{ github.event_name }}' -eq 'schedule') {
            $version = $env:AUTO_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid automatic version' }
            foreach ($propertyName in @('Version','FileVersion','AssemblyVersion','InformationalVersion')) {
              $nodes = $project.SelectNodes("/Project/PropertyGroup/$propertyName")
              if ($nodes.Count -ne 1) { throw "Expected one $propertyName property" }
              $nodes[0].InnerText = $version
            }
            $project.Save((Join-Path (Get-Location).Path $projectPath))
            $installerText = $installerText.Replace("#define AppVersion `"$installerVersion`"", "#define AppVersion `"$version`"")
            [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path $installerPath), $installerText, [System.Text.UTF8Encoding]::new($false))
          } else {
            $version = $projectVersion
            if ($installerVersion -ne $version) { throw "Installer $installerVersion differs from project $version" }
          }
          foreach ($propertyName in @('Version','FileVersion','AssemblyVersion','InformationalVersion')) {
            $value = [string]($project.SelectSingleNode("/Project/PropertyGroup/$propertyName").InnerText)
            if ($value -ne $version) { throw "$propertyName $value differs from $version" }
          }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare version commit before compilation
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SerialBridge.App/SerialBridge.App.csproj installer/SerialBridge.iss
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore(release): prepare v${{ steps.version.outputs.version }}"
            if ($LASTEXITCODE -ne 0) { throw 'Version commit failed' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Git diff failed' }
          "RELEASE_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Publish self-contained Windows x64 application
        run: dotnet publish src/SerialBridge.App -c Release -r win-x64 --self-contained true -o dist/publish --nologo

      - name: Inject application icon
        run: python scripts/inject_icon.py dist/publish/SerialBridge.exe src/SerialBridge.App/Assets/app.ico

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          Compress-Archive -Path dist/publish/* -DestinationPath "dist/portable/SerialBridge-Portable-$version-win-x64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed: $LASTEXITCODE" }
            $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
                    Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler not available' }
          & $iscc installer/SerialBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "dist/installer/SerialBridge-Setup-$version-x64.exe"
          $portable = "dist/portable/SerialBridge-Portable-$version-win-x64.zip"
          foreach ($file in @($installer, $portable, 'dist/publish/SerialBridge.exe')) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing or empty artifact: $file" }
          }
          $exeVersion = (Get-Item 'dist/publish/SerialBridge.exe').VersionInfo.ProductVersion
          if ($exeVersion.Split('+')[0] -ne $version) { throw "EXE version $exeVersion differs from $version" }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $portable).Path)
          try {
            if (-not ($zip.Entries | Where-Object { $_.FullName -eq 'SerialBridge.exe' })) {
              throw 'Portable ZIP is missing SerialBridge.exe'
            }
          } finally { $zip.Dispose() }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SerialBridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/installer/*.exe
            dist/portable/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit version and publish scheduled release
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $expected = '${{ needs.release-check.outputs.source_sha }}'
          $remote = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or -not $remote) { throw 'Could not inspect remote main' }
          $remoteSha = ($remote -split '\\s+')[0]
          if ($remoteSha -ne $expected) { throw 'main changed since eligibility check; stop to avoid stale release' }
          if ((git rev-parse HEAD).Trim() -ne $env:RELEASE_COMMIT) { throw 'Build commit changed unexpectedly' }
          if ((git rev-parse HEAD).Trim() -ne $expected) {
            git push origin "HEAD:refs/heads/main"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push version commit to main' }
          }
          $remoteTag = git ls-remote --tags --refs origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check remote release tag' }
          if (-not $remoteTag) {
            git tag -a $tag -m "Release $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed' }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Tag push failed' }
          } else {
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Existing tag fetch failed' }
            $tagSha = (git rev-list -n 1 $tag).Trim()
            $headSha = (git rev-parse HEAD).Trim()
            if ($tagSha -ne $headSha) { throw "Existing $tag points to a different commit" }
          }
          $installer = "dist/installer/SerialBridge-Setup-$version-x64.exe"
          $portable = "dist/portable/SerialBridge-Portable-$version-win-x64.zip"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable --clobber
          } else {
            gh release create $tag $installer $portable --verify-tag --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }

      - name: Publish manually tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.version }}'
          $installer = "dist/installer/SerialBridge-Setup-$version-x64.exe"
          $portable = "dist/portable/SerialBridge-Portable-$version-win-x64.zip"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable --clobber
          } else {
            gh release create $tag $installer $portable --verify-tag --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
