<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 333">
  <title id="title">AI agents meet real hardware</title>
  <desc id="desc">AI agents connect to SerialBridge on a Windows host via LAN TCP and communicate bidirectionally with embedded devices over a physical UART.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EDF3FE"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#1749B7"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#23476D" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#4D79BC"/></marker>
  </defs>
  <rect width="900" height="333" rx="19" fill="url(#background)"/>
  <circle cx="854" cy="10" r="100" fill="#DEEAFE" opacity=".6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif">
    <text x="28" y="44" font-size="27" font-weight="700" fill="#163863">AI agents meet real hardware</text>
    <text x="29" y="75" font-size="18" fill="#48688D">LAN access · transparent bidirectional serial transport</text>
    <g filter="url(#shadow)"><rect x="28" y="100" width="240" height="204" rx="16" fill="#FFFFFF" stroke="#CADAF1"/><rect x="330" y="100" width="240" height="204" rx="16" fill="url(#blue)" stroke="#1D54BE"/><rect x="632" y="100" width="240" height="204" rx="16" fill="#FFFFFF" stroke="#CAE4D8"/></g>
    <g transform="translate(49 117)" stroke="#3168D9" stroke-width="2.5" fill="none" stroke-linecap="round"><rect x="1" y="7" width="36" height="29" rx="7" fill="#E8F0FF"/><path d="M19 1v6M11 18h1M27 18h1M12 27h15"/></g>
    <g transform="translate(352 119)" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"><rect width="37" height="32" rx="7"/><path d="M9 11h19M9 21h19"/></g>
    <g transform="translate(654 119)" stroke="#2E8A62" stroke-width="2.4" fill="none" stroke-linecap="round"><rect x="4" y="4" width="33" height="33" rx="5" fill="#E8F6EF"/><path d="M0 12h4M0 21h4M0 29h4M37 12h4M37 21h4M37 29h4M12 0v4M21 0v4M29 0v4M12 37v4M21 37v4M29 37v4"/></g>
    <text x="48" y="203" font-size="22" font-weight="700" fill="#18345B">AI Agent / Developer</text>
    <text x="48" y="232" font-size="17" font-weight="500" fill="#4E6886">Logs · Diagnostics</text>
    <rect x="48" y="252" width="200" height="34" rx="17" fill="#EBF2FE"/>
    <text x="60" y="274" font-size="16" font-weight="600" fill="#2758A0">Agent · Scripts</text>
    <text x="350" y="203" font-size="26" font-weight="700" fill="#FFFFFF">SerialBridge</text>
    <text x="350" y="232" font-size="17" font-weight="500" fill="#E2EDFF">Windows Serial ↔ TCP</text>
    <rect x="350" y="252" width="200" height="34" rx="17" fill="#4F80D9"/>
    <text x="362" y="274" font-size="16" font-weight="600" fill="#FFFFFF">TCP 9001 ↔ COM3</text>
    <text x="652" y="203" font-size="22" font-weight="700" fill="#18345B">Embedded Device</text>
    <text x="652" y="232" font-size="17" font-weight="500" fill="#4E6886">Serial Console · UART</text>
    <rect x="652" y="252" width="200" height="34" rx="17" fill="#E8F6EF"/>
    <text x="664" y="274" font-size="16" font-weight="600" fill="#217651">Linux · MCU</text>
    <path d="M275 213H323" fill="none" stroke="#4D79BC" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M577 213H625" fill="none" stroke="#4D79BC" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="299" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#235AA6">TCP</text>
    <text x="601" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#235AA6">UART</text>
  </g>
</svg>