<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" role="img" aria-labelledby="title desc">
<title id="title">AI agents meet real hardware</title>
<desc id="desc">Give AI agents access to physical serial ports over your local network. AI agents connect via LAN TCP to a Windows serial bridge, which communicates with embedded hardware over UART.</desc>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EAF2FD"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#1542AC"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#244968" flood-opacity=".09"/></filter>
<marker id="arrowStart" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M1 5L9 1L9 9Z" fill="#477ABB"/></marker>
<marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#477ABB"/></marker>
</defs>
<rect width="900" height="748" rx="24" fill="url(#background)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif">
<text x="28" y="46" font-weight="750" font-size="35" fill="#14365F">AI agents meet real hardware</text>
<text x="29" y="82" font-size="20" fill="#456689">Give AI agents access to physical serial ports over your local network</text>
<g filter="url(#shadow)"><rect x="26" y="110" width="848" height="151" rx="19" fill="#FFFFFF" stroke="#D7E5F4"/></g>
 <rect x="57" y="143" width="53" height="48" rx="12" fill="#E7F0FF" stroke="#4A78D7" stroke-width="2"/><path d="M83 134v9M70 161h1M94 161h1M72 178h23" fill="none" stroke="#3773DE" stroke-width="2.5" stroke-linecap="round"/>
 <text x="134" y="164" font-size="31" font-weight="750" fill="#143155">AI Agent / Developer</text>
 <text x="134" y="201" font-size="23" fill="#435D7C">Inspect boot logs · Run diagnostics</text>
 <rect x="134" y="218" width="255" height="30" rx="15" fill="#E8F0FE"/>
 <text x="149" y="239" font-size="19" font-weight="650" fill="#235BA4">Linux · Windows · Scripts</text>
 <text x="827" y="155" font-size="31" text-anchor="end" font-weight="750" fill="#B1C9E7">01</text>
<g filter="url(#shadow)"><rect x="26" y="315" width="848" height="151" rx="19" fill="url(#blue)" stroke="#1B51B6"/></g>
 <rect x="57" y="348" width="53" height="48" rx="12" fill="#FFFFFF" fill-opacity=".18" stroke="#FFFFFF" stroke-width="2"/><path d="M68 364h32M68 378h32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
 <text x="134" y="369" font-size="31" font-weight="750" fill="#FFFFFF">SerialBridge</text>
 <text x="134" y="406" font-size="23" fill="#E2EDFF">Transparent serial ↔ TCP bridge on Windows</text>
 <rect x="134" y="423" width="255" height="30" rx="15" fill="#487BD8"/>
 <text x="149" y="444" font-size="19" font-weight="650" fill="#FFFFFF">TCP :9001 ↔ COM3</text>
 <text x="827" y="360" font-size="31" text-anchor="end" font-weight="750" fill="#CFE0FF">02</text>
<g filter="url(#shadow)"><rect x="26" y="520" width="848" height="151" rx="19" fill="#FFFFFF" stroke="#D7E5F4"/></g>
 <rect x="64" y="559" width="42" height="42" rx="7" fill="#E4F7EB" stroke="#27835B" stroke-width="2.5"/><path d="M57 569h7M57 590h7M106 569h7M106 590h7M75 552v7M96 552v7M75 601v7M96 601v7" stroke="#27835B" stroke-width="2.5" stroke-linecap="round"/>
 <text x="134" y="574" font-size="31" font-weight="750" fill="#143155">Embedded Device</text>
 <text x="134" y="611" font-size="23" fill="#435D7C">Access the board's serial console over UART</text>
 <rect x="134" y="628" width="260" height="30" rx="15" fill="#E5F5ED"/>
 <text x="149" y="649" font-size="19" font-weight="650" fill="#1D7850">Embedded Linux · MCU</text>
 <text x="827" y="565" font-size="31" text-anchor="end" font-weight="750" fill="#B1C9E7">03</text>
<path d="M450 263v48" stroke="#477ABB" stroke-width="3.7" fill="none" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
 <rect x="490" y="272" width="270" height="31" rx="15" fill="#E4EFFC"/>
 <text x="505" y="294" font-size="19" font-weight="700" fill="#265D9D">LAN TCP · Bidirectional</text>
<path d="M450 468v48" stroke="#477ABB" stroke-width="3.7" fill="none" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
 <rect x="490" y="477" width="270" height="31" rx="15" fill="#E4EFFC"/>
 <text x="505" y="499" font-size="19" font-weight="700" fill="#265D9D">USB / UART · Bidirectional</text>
<text x="29" y="718" font-size="18" fill="#4B6687">Serial port settings are managed on Windows; SerialBridge does not include an AI model.</text>
</g>
</svg>