<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-labelledby="title description">
  <title id="title">Remote serial access between two SerialBridge instances</title>
  <desc id="description">Each app can share local serial ports or connect to remote ones. UDP 39001 · Optional discovery (opt-in on B). Raw TCP bidirectional bytes · no built-in auth/encryption.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFF"/><stop offset="1" stop-color="#EEF5FD"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#1645B1"/></linearGradient>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8Z" fill="#2563EB"/></marker>
    <marker id="grayArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1120" height="470" rx="20" fill="url(#bg)"/>
  <g font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif">
    <text x="38" y="56" font-size="28" font-weight="700" fill="#16345C">Remote serial access between two SerialBridge instances</text>
    <text x="39" y="84" font-size="15" fill="#507096">Each app can share local serial ports or connect to remote ones</text>
    <!-- Peer A -->
    <rect x="38" y="121" width="370" height="174" rx="16" fill="#FFFFFF" stroke="#C5D9F1" stroke-width="1.5"/>
    <rect x="38" y="121" width="370" height="47" rx="16" fill="#DDEAFE"/>
    <rect x="38" y="150" width="370" height="18" fill="#DDEAFE"/>
    <text x="58" y="152" font-size="19" font-weight="700" fill="#1645A1">Computer A · Client</text>
    <text x="60" y="202" font-size="21" font-weight="700" fill="#1D3555">SerialBridge</text>
    <text x="60" y="232" font-size="16" fill="#4B688C">Remote connections → Terminal / Macros</text>
    <rect x="58" y="249" width="300" height="30" rx="14" fill="#EAF1FE"/>
    <text x="72" y="270" font-size="15" fill="#255CB1">RemoteTcpSession / TCP client</text>
    <!-- Peer B -->
    <rect x="712" y="121" width="370" height="174" rx="16" fill="#FFFFFF" stroke="#A5C5EF" stroke-width="1.5"/>
    <rect x="712" y="121" width="370" height="47" rx="16" fill="url(#blue)"/>
    <rect x="712" y="150" width="370" height="18" fill="#2053C7"/>
    <text x="732" y="152" font-size="19" font-weight="700" fill="#FFFFFF">Computer B · Server</text>
    <text x="734" y="202" font-size="21" font-weight="700" fill="#1D3555">SerialBridge</text>
    <text x="734" y="232" font-size="16" fill="#4B688C">COM mapping → TCP 9001</text>
    <rect x="732" y="249" width="309" height="30" rx="14" fill="#EAF1FE"/>
    <text x="744" y="270" font-size="15" fill="#255CB1">TcpServerService / COM3</text>
    <!-- Data TCP -->
    <path d="M425 209H695" stroke="#2563EB" stroke-width="3" fill="none" marker-start="url(#blueArrow)" marker-end="url(#blueArrow)"/>
    <rect x="437" y="161" width="246" height="34" rx="17" fill="#DFEAFF"/>
    <text x="560" y="183" font-size="14" text-anchor="middle" font-weight="700" fill="#1B4EA7">Raw TCP data channel</text>
    <text x="560" y="241" font-size="14" fill="#335D91" text-anchor="middle">192.168.1.100:9001</text>
    <!-- Discovery is separate and optional -->
    <path d="M408 329H712" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-start="url(#grayArrow)" marker-end="url(#grayArrow)"/>
    <text x="560" y="313" font-size="14" fill="#456383" text-anchor="middle">UDP 39001 · Optional discovery (opt-in on B)</text>
    <!-- Device -->
    <path d="M899 297V348" stroke="#2563EB" stroke-width="2.5" fill="none" marker-start="url(#blueArrow)" marker-end="url(#blueArrow)"/>
    <text x="914" y="331" font-size="12.5" fill="#456383">USB / UART</text>
    <rect x="712" y="355" width="370" height="43" rx="11" fill="#E4F6ED" stroke="#A4D3BA"/>
    <text x="897" y="383" font-size="16" text-anchor="middle" font-weight="700" fill="#20704A">Development board / MCU / Embedded Linux</text>
    <text x="40" y="370" font-size="14" fill="#44678A">Manual connection: IP + port; discovery is not required</text>
    <text x="40" y="440" font-size="14" fill="#537395">Discovery exchanges metadata only. Serial data always travels over TCP.</text>
  </g>
</svg>